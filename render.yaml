services:
  - type: web
    name: uzdi-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        value: https://uzdi-backend-api.onrender.com/api/v1
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_ENABLE_DELETE
        value: "false"
      - key: VITE_ROUTER_MODE
        value: history
      - key: VITE_BASE
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
