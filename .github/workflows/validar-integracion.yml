name: Validar integración frontend

on:
  push:
    branches: [revision-codex-20261123]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar producción
        run: npm run build
        env:
          VITE_API_URL: https://uzdi-backend-api.onrender.com/api/v1
          VITE_USE_MOCK: 'false'
          VITE_ENABLE_DELETE: 'false'
          VITE_ROUTER_MODE: history
          VITE_BASE: /
